<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEURA FLOWERS - Fresh Blooms</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <style>
    :root {
      --pink: #cf7c86;
      --dark-black: #2d2d2d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Verdana, sans-serif;
      text-decoration: none;
      outline: none;
      border: none;
      transition: all .2s linear;
    }

    html {
      font-size: 10px;
    }

    /*       HEADER       */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 9%;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
      flex-direction: column;
    }

    header .logo {
      font-size: 4rem;
      color: #333;
      font-weight: bold;
      background: none;
      cursor: pointer;
    }

    header .logo span {
      color: var(--pink);
    }

    header .navbar a,
    header .navbar button {
      font-size: 2.5rem;
      margin-left: 2rem;
      color: #272626;
      background: none;
      cursor: pointer;
    }

    header .navbar button:hover {
      color: var(--pink);
    }

    header .user-icons a,
    header .user-icons button {
      font-size: 3.5rem;
      color: var(--dark-black);
      margin-left: 2.5rem;
      cursor: pointer;
      background: none;
    }

    header .user-icons button:hover {
      color: var(--pink);
    }

    /*      BUTTONS      */
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: .8rem 3rem;
      background: var(--dark-black);
      color: #ffffff;
      font-size: 1.7rem;
      border-radius: .5rem;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--pink);
      letter-spacing: .1rem;
    }

    /*      HEADING      */
    .heading {
      text-align: center;
      font-size: 4rem;
      color: var(--dark-black);
      padding: 1rem;
      margin: 2rem 0;
    }

    .heading span {
      color: var(--pink);
    }

    /*      HOME      */
    .home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: url('public/home.png') no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .home .content {
      max-width: 60rem;
      padding-left: 9%;
    }

    .home .content h3 {
      font-size: 6rem;
      color: var(--dark-black);
      text-transform: uppercase;
    }

    .home .content span {
      font-size: 3.5rem;
      color: #294924;
      padding: 1rem 0;
      display: block;
      line-height: 1.5;
    }

    .home .content p {
      font-size: 1.5rem;
      color: #000000;
      padding: 1rem 0;
      line-height: 1.5;
    }

    /*      ABOUT        */
    .about {
      padding-top: 80px;
    }

    .about .row {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 2rem 9%;
    }

    .about .row .video-container {
      flex: 1 1 40rem;
    }

    .about .row .video-container video {
      width: 100%;
      border: 1.5rem solid #fff;
      border-radius: .5rem;
      box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
      object-fit: cover;
    }

    .about .row .content {
      flex: 1 1 40rem;
    }

    .about .row .content h3 {
      font-size: 3rem;
      color: var(--dark-black);
    }

    .about .row .content p {
      font-size: 1.5rem;
      color: #666;
      padding: 1rem 0;
      line-height: 2;
    }

    /*       PRODUCTS       */
    .products {
      padding: 2rem 9%;
      padding-top: 100px;
    }

    .products .box-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr));
      gap: 1.5rem;
    }

    .products .box {
      text-align: center;
      border: .1rem solid rgba(0, 0, 0, .1);
      border-radius: .5rem;
      padding: 2rem;
      position: relative;
    }

    .products .box .discount {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--pink);
      color: #fff;
      padding: .5rem 1rem;
      font-size: 1.5rem;
      border-radius: .5rem;
    }

    .products .box .image img {
      width: 100%;
      height: 25rem;
      object-fit: cover;
    }

    .products .box .icons {
      margin-top: 1rem;
    }

    .products .box .icons a,
    .products .box .icons button {
      font-size: 2rem;
      margin: 0 .5rem;
      color: #333;
      background: none;
      cursor: pointer;
    }

    .products .box .icons .cart-btn {
      display: inline-block;
      padding: .8rem 1.5rem;
      background: var(--pink);
      color: #fff;
      border-radius: .5rem;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .products .box .content h3 {
      font-size: 2.5rem;
      color: #333;
      margin-top: 1rem;
    }

    .products .box .content .price {
      font-size: 2.5rem;
      color: var(--pink);
    }

    .products .box .content .price span {
      font-size: 1.5rem;
      color: #999;
      text-decoration: line-through;
    }

    /*      REVIEW       */
    .review {
      padding: 2rem 9%;
      padding-top: 100px;
      background: #f9f9f9;
    }

    .review-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .review-box {
      background: #fff;
      border: .1rem solid rgba(0, 0, 0, .1);
      border-radius: .5rem;
      padding: 2rem;
      text-align: center;
    }

    .review-box img {
      width: 8rem;
      height: 8rem;
      border-radius: 50%;
      object-fit: cover;
      border: .3rem solid var(--pink);
      margin-bottom: 1rem;
    }

    .review-box .stars {
      color: gold;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .review-box p {
      font-size: 1.4rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 1rem;
    }

    .review-box h3 {
      font-size: 1.8rem;
      color: var(--dark-black);
    }

    /*       CONTACT       */
    .contact {
      padding: 2rem 9%;
      padding-top: 100px;
    }

    .contact .row {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .contact .info {
      flex: 1 1 30rem;
    }

    .contact .info h3 {
      font-size: 2.5rem;
      color: var(--dark-black);
      margin-bottom: 1rem;
    }

    .contact .info p {
      font-size: 1.5rem;
      color: #666;
      line-height: 2;
      margin-bottom: 1rem;
    }

    .contact .info p i {
      color: var(--pink);
      margin-right: 1rem;
    }

    .contact .form-container {
      flex: 1 1 40rem;
    }

    .contact .form-container input,
    .contact .form-container textarea {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.5rem;
      border: .1rem solid rgba(0, 0, 0, .2);
      border-radius: .5rem;
      margin-bottom: 1.5rem;
      font-family: Verdana, sans-serif;
      outline: none;
    }

    .contact .form-container input:focus,
    .contact .form-container textarea:focus {
      border-color: var(--pink);
    }

    .contact .form-container textarea {
      resize: vertical;
      height: 15rem;
    }

    .contact .form-container .btn {
      margin-top: 0;
      width: 100%;
      text-align: center;
    }

    .success-msg {
      background: #e8f5e9;
      color: #2d5a27;
      padding: 1rem;
      border-radius: .5rem;
      font-size: 1.5rem;
      text-align: center;
      margin-top: 1rem;
    }

    /*       PAGE WRAPPER       */
    .page-content {
      padding-top: 80px;
    }

    /*       FOOTER       */
    footer {
      background: var(--dark-black);
      color: #fff;
      text-align: center;
      padding: 2rem;
      font-size: 1.5rem;
      margin-top: 3rem;
    }

    footer span {
      color: var(--pink);
    }

    /*       RESPONSIVE      */
   @media (max-width: 768px) {
  html {
    font-size: 55%;
  }

  header {
    padding: 1rem 4%;
  }

  header .navbar {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 0.5rem;
  }

  header .navbar button {
    font-size: 1.1rem;
    padding: 0.2rem 0.5rem;
  }

  .home .content h3 {
    font-size: 2.5rem;
  }

  .home {
    background-size: cover;
    background-position: center;
    min-height: 80vh;
  }

  .about .row {
    flex-direction: column;
  }

  .products .box-container {
    grid-template-columns: 1fr;
  }

  .contact .row {
    flex-direction: column;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 50%;
  }

  header .navbar button {
    font-size: 1rem;
    padding: 0.2rem 0.4rem;
  }

  .home .content h3 {
    font-size: 2rem;
  }
}
    
  </style>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /*       HEADER       */
    function Header({ page, setPage }) {
      return (
        <header>
          <div className="user-icons">
            <button className="fas fa-heart"></button>
            <button className="fas fa-shopping-cart"></button>
            <button className="fas fa-user"></button>
          </div>

          <button className="logo" onClick={() => setPage('home')}>
            LEURA<span> FLOWERS</span>
          </button>

          <nav className="navbar">
            {['home', 'about', 'products', 'review', 'contact'].map(p => (
              <button key={p} onClick={() => setPage(p)}
                style={{ color: page === p ? 'var(--pink)' : '' }}>
                {p}
              </button>
            ))}
          </nav>
        </header>
      );
    }

    /*       HOME       */
    function Home({ setPage }) {
      return (
        <section className="home" id="home">
          <div className="content">
            <h3>LEURA FLOWERS</h3>
            <span>Natural &amp; Beautiful Flowers</span>
            <p>Discover the freshest blooms for every occasion, hand-delivered with love from Léura's Flowers.</p>
            <button className="btn" onClick={() => setPage('products')}>Shop Now</button>
          </div>
        </section>
      );
    }

    /*       ABOUT       */
    function About() {
      return (
        <section className="about" id="about">
          <h1 className="heading"> <span> about </span> us </h1>
          <div className="row">
            <div className="video-container">
              <video src="public/about-vid.mp4" loop autoPlay muted playsInline></video>
            </div>
            <div className="content">
              <h3>Why Choose Us?</h3>
              <p>At Léura Flowers, we pride ourselves on sourcing the freshest blooms directly from local growers. Our passion for floral design ensures every bouquet tells a unique story of beauty and nature.</p>
              <p>With years of experience and a commitment to quality, we offer hand-delivered arrangements that brighten every occasion and space.</p>
              <a href="#" className="btn">Learn More</a>
            </div>
          </div>
        </section>
      );
    }

    /*       PRODUCTS      */
    function Products() {
      return (
        <section className="products" id="products">
          <h1 className="heading"> Latest <span>Products</span> </h1>
          <div className="box-container">

            <div className="box">
              <span className="discount">-10%</span>
              <div className="image">
                <img src="public/product-1.jpeg" alt="Flower" />
                <div className="icons">
                  <a href="#" className="fas fa-heart"></a>
                  <button className="cart-btn">add to cart</button>
                  <a href="#" className="fas fa-share"></a>
                </div>
              </div>
              <div className="content">
                <h3>flower card</h3>
                <div className="price">$12 <span>$15</span></div>
              </div>
            </div>

            <div className="box">
              <span className="discount">-15%</span>
              <div className="image">
                <img src="public/product-2.jpeg" alt="Flower" />
                <div className="icons">
                  <a href="#" className="fas fa-heart"></a>
                  <button className="cart-btn">add to cart</button>
                  <a href="#" className="fas fa-share"></a>
                </div>
              </div>
              <div className="content">
                <h3>rose cup</h3>
                <div className="price">$18 <span>$20</span></div>
              </div>
            </div>

            <div className="box">
              <span className="discount">-20%</span>
              <div className="image">
                <img src="public/product-3.jpg" alt="Flower" />
                <div className="icons">
                  <a href="#" className="fas fa-heart"></a>
                  <button className="cart-btn">add to cart</button>
                  <a href="#" className="fas fa-share"></a>
                </div>
              </div>
              <div className="content">
                <h3>spring bouquet</h3>
                <div className="price">$22 <span>$28</span></div>
              </div>
            </div>

            <div className="box">
              <span className="discount">-12%</span>
              <div className="image">
                <img src="public/product-4.jpg" alt="Flower" />
                <div className="icons">
                  <a href="#" className="fas fa-heart"></a>
                  <button className="cart-btn">add to cart</button>
                  <a href="#" className="fas fa-share"></a>
                </div>
              </div>
              <div className="content">
                <h3>peony box</h3>
                <div className="price">$30 <span>$34</span></div>
              </div>
            </div>

          </div>
        </section>
      );
    }

    /*       REVIEW       */
    function Review() {
      const reviews = [
        { name: "Sarah M.", stars: 5, text: "The flowers were absolutely stunning! Fresh, beautiful, and delivered right on time. Will definitely order again." },
        { name: "Lina K.", stars: 5, text: "Amazing quality and so beautifully arranged. Léura Flowers never disappoints. My go-to flower shop!" },
        { name: "Maya R.", stars: 4, text: "Lovely bouquet and great packaging. The flowers lasted over a week. Very happy with my purchase!" },
      ];

      return (
        <section className="review" id="review">
          <h1 className="heading"> Customer <span>Reviews</span> </h1>
          <div className="review-container">
            {reviews.map((r, i) => (
              <div className="review-box" key={i}>
                <div className="stars">
                  {'★'.repeat(r.stars)}{'☆'.repeat(5 - r.stars)}
                </div>
                <p>"{r.text}"</p>
                <h3>— {r.name}</h3>
              </div>
            ))}
          </div>
        </section>
      );
    }

    /*       CONTACT       */
    function Contact() {
      const [form, setForm] = useState({ name: '', email: '', message: '' });
      const [sent, setSent] = useState(false);

      const handle = e => setForm({ ...form, [e.target.name]: e.target.value });

      const submit = () => {
        if (form.name && form.email && form.message) {
          setSent(true);
          setForm({ name: '', email: '', message: '' });
          setTimeout(() => setSent(false), 4000);
        }
      };

      return (
        <section className="contact" id="contact">
          <h1 className="heading"> Contact <span>Us</span> </h1>
          <div className="row">
            <div className="info">
              <h3>Get In Touch</h3>
              <p><i className="fas fa-map-marker-alt"></i> Jibsheet, Nabatieh, Lebanon</p>
              <p><i className="fas fa-phone"></i> +961 03 234 567</p>
              <p><i className="fas fa-envelope"></i> Me@leuraflowers.com</p>
              <p><i className="fas fa-clock"></i> Mon–Sat: 8am – 8pm</p>
            </div>

            <div className="form-container">
              <input name="name" value={form.name} onChange={handle} placeholder="Your Name" />
              <input name="email" type="email" value={form.email} onChange={handle} placeholder="Your Email" />
              <textarea name="message" value={form.message} onChange={handle} placeholder="Your Message"></textarea>
              <button className="btn" onClick={submit}>Send Message</button>
              {sent && <div className="success-msg">✓ Message sent! We'll get back to you soon.</div>}
            </div>
          </div>
        </section>
      );
    }

    /*       FOOTER        */
    function Footer() {
      return (
        <footer>
          <p>© 2026 <span>LEURA FLOWERS</span>. All rights reserved.</p>
        </footer>
      );
    }

    /*       APP       */
    function App() {
      const [page, setPage] = useState('home');

      useEffect(() => { window.scrollTo(0, 0); }, [page]);

      const renderPage = () => {
        switch (page) {
          case 'home': return <Home setPage={setPage} />;
          case 'about': return <div className="page-content"><About /></div>;
          case 'products': return <div className="page-content"><Products /></div>;
          case 'review': return <div className="page-content"><Review /></div>;
          case 'contact': return <div className="page-content"><Contact /></div>;
          default: return <Home setPage={setPage} />;
        }
      };

      return (
        <>
          <Header page={page} setPage={setPage} />
          {renderPage()}
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
